<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>固定20問の輪郭確認</title><style>body{font:14px system-ui,sans-serif;background:#f6f5ef;color:#294337;padding:20px}main{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{background:#fffef9;border:1px solid #dce3d7;border-radius:8px;padding:12px}h2{font-size:13px;margin:0}p{font-size:11px;color:#7c8974}svg{width:100%;height:145px}</style></head><body><h1>独自作成した固定20問</h1><p>輪郭と解答配置の検証用。アクセス記録は送信しません。</p><main id="gallery"></main><script type="module">
import {BUILTIN_PROBLEMS} from '../puzzles.js';import {polygon} from '../geometry.js';import {regionPath} from '../silhouette.js';import {outlineMetrics} from '../outline.js';
for(const q of BUILTIN_PROBLEMS){const article=document.createElement('article'),title=document.createElement('h2'),desc=document.createElement('p');title.textContent=q.title;const m=outlineMetrics(q.pieces);desc.textContent=`${q.pieces.length}ピース · 頂点${m.corners} · 凹${m.concave}`;const p=q.pieces.flatMap(polygon),x=Math.min(...p.map(v=>v.x)),y=Math.min(...p.map(v=>v.y)),w=Math.max(...p.map(v=>v.x))-x,h=Math.max(...p.map(v=>v.y))-y;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`${x-.4} ${y-.4} ${w+.8} ${h+.8}`);const path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',regionPath(q.pieces));path.setAttribute('fill','#202923');svg.append(path);article.append(title,desc,svg);document.querySelector('#gallery').append(article);}
</script></body></html>
