<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タングラム アクセス記録テスト</title>
<style>body{font:14px system-ui,sans-serif;padding:24px;color:#294337;background:#f6f5ef}li{margin:8px 0}.fail{color:#ac3425}iframe{width:1100px;height:900px;border:1px solid #c9d5c2;max-width:100%}#summary{font-weight:bold}</style></head><body>
<h1>タングラム アクセス記録の統合テスト</h1>
<p>本番HTML・本番モジュールをiframeで実行します。GAS通信だけを成功・非同期失敗・同期失敗に差し替えます。実GASへのテスト記録は送信しません。ファイルのダウンロード起動だけを止め、生成したJSON・PNGのBlobを検査します。</p>
<p id="summary">実行中…</p><ol id="results"></ol><iframe id="app" title="テスト対象アプリ"></iframe>
<script type="module">
import {ACCESS_CONFIG} from '../access-counter.js';
import {squarePieces} from '../geometry.js';
import {makeDocument} from '../state.js';
const frame = document.querySelector('#app'), attempts = [], downloads = [], errors = [];
let scenario = 'success', passed = 0, failed = 0, d;
const assert = (condition, description) => {if (!condition) throw Error(description);};
const $ = selector => d.querySelector(selector);
const click = selector => $(selector).click();
const waitFor = async condition => {
  const limit = Date.now() + 10000;
  while (!condition()) {
    if (Date.now() > limit) throw Error('待機がタイムアウトしました');
    await new Promise(resolve => setTimeout(resolve, 20));
  }
};
async function test(name, run) {
  const row = document.createElement('li');
  try {await run(); passed++; row.textContent = '✓ ' + name;}
  catch (error) {failed++; row.className = 'fail'; row.textContent = '✗ ' + name + ': ' + error.message;}
  document.querySelector('#results').append(row);
}
window.captureAccess = (id, args) => {
  attempts.push({id, args});
  if (scenario === 'throw') throw Error('synchronous offline');
  if (scenario === 'reject') return Promise.reject(Error('asynchronous offline'));
  return Promise.resolve({type:'opaque'});
};
window.captureDownload = (id, href, name) => {
  // Read the real Blob before the app revokes its object URL. No outbound request.
  downloads.push({id, name, blob:fetch(href).then(response => response.blob())});
};
window.captureError = error => errors.push(String(error));
const original = await (await fetch('../index.html', {cache:'no-store'})).text();
const injected = `<base href="../"><script>
const documentId=crypto.randomUUID();
window.fetch=(...args)=>parent.captureAccess(documentId,args);
HTMLAnchorElement.prototype.click=function(){parent.captureDownload(documentId,this.href,this.download);};
window.addEventListener('error',event=>parent.captureError(event.message));
window.addEventListener('unhandledrejection',event=>parent.captureError(event.reason));
<\/script>`;
const html = original.replace('<head>', '<head>' + injected);
const loaded = () => new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
async function loadFile(document) {
  const w = frame.contentWindow, transfer = new w.DataTransfer();
  transfer.items.add(new w.File([JSON.stringify(document)], 'test.json', {type:'application/json'}));
  $('#file').files = transfer.files;
  $('#file').dispatchEvent(new w.Event('change'));
  await waitFor(() => $('#title').value === document.title);
}
for (const name of ['success', 'reject', 'throw']) {
  scenario = name;
  const before = attempts.length, errorBefore = errors.length;
  let firstId;
  await test(`${name}：初回表示は共通GASへapp=tangramのGETを1回`, async () => {
    const ready = loaded(); frame.srcdoc = html; await ready; d = frame.contentDocument;
    assert($('#pieces polygon'), 'ピースが表示されていません');
    assert(attempts.length === before + 1, '初回送信回数が不正');
    const call = attempts.at(-1); firstId = call.id;
    assert(call.args[0] === ACCESS_CONFIG.endpoint + '?app=tangram', 'GAS URLまたはappが不正');
    assert(JSON.stringify(call.args[1]) === JSON.stringify({method:'GET',mode:'no-cors',cache:'no-store',credentials:'omit',keepalive:true}), '送信方式が不一致');
  });
  await test(`${name}：3モード・移動・回転・反転・選択・履歴・表示操作で追加送信なし`, () => {
    click('[data-mode="create"]'); click('#reset');
    $('#title').value = 'アクセス試験'; $('#title').dispatchEvent(new frame.contentWindow.Event('change'));
    const board = $('#board'), piece = $('#pieces polygon[data-id="0"]');
    // Synthetic pointer events have no native capture target; only capture is stubbed.
    board.setPointerCapture = () => {}; board.hasPointerCapture = () => false;
    const matrix = board.getScreenCTM();
    const point = (x,y) => new frame.contentWindow.DOMPoint(x,y).matrixTransform(matrix);
    const start = point(3,3), end = point(3,4.2);
    const event = (type, pos) => new frame.contentWindow.PointerEvent(type, {bubbles:true,pointerId:99,button:0,clientX:pos.x,clientY:pos.y});
    piece.dispatchEvent(event('pointerdown',start)); board.dispatchEvent(event('pointermove',end)); board.dispatchEvent(event('pointerup',end));
    assert($('#message').textContent === '配置しました。', 'ドラッグ処理が未完了');
    click('#rotate-right'); click('#rotate-left'); click('#flip'); click('#undo'); click('#redo');
    $('#piece-list input').click(); assert($('#piece-count').textContent === '6', 'ピース選択が動作しません');
    click('#example'); click('#zoom-in'); click('#zoom-out'); click('#zoom-fit'); click('#zoom-reset'); click('#pan-view'); click('#pan-view');
    click('#register'); click('#check'); click('#show-answer'); click('#close-answer');
    click('[data-mode="square"]'); click('#example'); click('#check');
    assert($('#message').classList.contains('success'), '通信失敗後の正方形成功判定が動作しません');
    click('#help'); assert($('#help-dialog').open, 'ヘルプ表示が動作しません'); click('#close-help');
    assert(attempts.length === before + 1, '操作で追加送信されました');
  });
  await test(`${name}：JSON保存・読込・問題登録でも追加送信なし`, async () => {
    const count = downloads.length;
    click('#save');
    assert(downloads.length === count + 1, 'JSON保存が動作しません');
    const saved = JSON.parse(await (await downloads.at(-1).blob).text());
    assert(saved.format === 'tangram-lab' && saved.kind === 'square', '完成配置JSONが不正');
    await loadFile(makeDocument('読込テスト・制作途中', squarePieces(), 'draft'));
    assert($('#title').value === '読込テスト・制作途中', '制作途中読込が未完了');
    await loadFile(makeDocument('読込テスト・問題', squarePieces(), 'problem'));
    click('#register');
    assert($('#target path'), '問題シルエットが表示されません');
    assert(attempts.length === before + 1, 'ファイル操作で追加送信されました');
  });
  await test(`${name}：実PNG生成は正常、追加送信なし`, async () => {
    const count = downloads.length;
    click('#png-silhouette'); click('#png-answer');
    await waitFor(() => downloads.length === count + 2);
    for (const entry of downloads.slice(count)) {
      const blob = await entry.blob, bytes = new Uint8Array(await blob.arrayBuffer());
      assert(blob.type === 'image/png' && bytes[0] === 137 && bytes[1] === 80 && bytes.length > 100, 'PNGが不正');
    }
    assert(attempts.length === before + 1, 'PNG保存で追加送信されました');
  });
  await test(`${name}：実際の文書再読み込みで新たに1回`, async () => {
    const ready = loaded(); frame.contentWindow.location.reload(); await ready; d = frame.contentDocument;
    assert(attempts.length === before + 2, '再読込の送信回数が不正');
    assert(attempts.at(-1).id !== firstId, '新しい文書ではありません');
    assert(attempts.at(-1).args[0] === ACCESS_CONFIG.endpoint + '?app=tangram', '再読込のURLが不正');
  });
  await test(`${name}：通信エラーがUIへ伝播せず再送もない`, async () => {
    await new Promise(resolve => setTimeout(resolve, 100));
    click('[data-mode="square"]'); click('#example'); click('#check');
    assert($('#message').classList.contains('success'), '再読込後に操作できません');
    assert(errors.length === errorBefore, errors.slice(errorBefore).join('; '));
    assert(attempts.length === before + 2, '失敗後の再送・追加送信があります');
  });
}
document.querySelector('#summary').textContent = `${passed} / ${passed + failed} 件成功、失敗 ${failed} 件（実GAS通信なし）`;
document.title = `${passed}/${passed + failed} 成功 | アクセス記録テスト`;
</script></body></html>
