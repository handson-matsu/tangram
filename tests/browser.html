<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タングラム 幾何テスト</title><style>body{font-family:system-ui,sans-serif;max-width:900px;padding:24px;margin:auto;background:#f7f8f2;color:#294337}li{padding:8px;border-bottom:1px solid #dae1d4;font-size:13px}.fail{color:#a23327}pre{white-space:pre-wrap}a{color:inherit}</style><h1>タングラム 幾何テスト</h1><p>Node.js版と同一のテストケースを、このブラウザのJavaScriptで実行します。</p><p id="summary">実行中…</p><ol id="results"></ol><p><a href="../">アプリに戻る</a></p><script type="module">
import {runTests} from './cases.js';
import {runAccessTests} from './access-cases.js';
const equal=(a,b)=>{if(!Object.is(a,b))throw Error(`期待値 ${String(b)} / 実際 ${String(a)}`);};
const assert={equal,ok:v=>{if(!v)throw Error('条件が成立しません');},deepEqual:(a,b)=>equal(JSON.stringify(a),JSON.stringify(b)),notDeepEqual:(a,b)=>{if(JSON.stringify(a)===JSON.stringify(b))throw Error('異なる値を期待しました');},throws:fn=>{let thrown=false;try{fn();}catch{thrown=true;}if(!thrown)throw Error('例外を期待しました');}};
let total=0,passed=0;
const execute = async (name,fn)=>{total++;const row=document.createElement('li');try{await fn();passed++;row.textContent=`✓ ${name}`;}catch(e){row.className='fail';row.textContent=`✗ ${name}`;const details=document.createElement('pre');details.textContent=e.stack;row.append(details);}document.querySelector('#results').append(row);};
const tasks=[];
const register=(name,fn)=>tasks.push([name,fn]);
runTests(register,assert);
runAccessTests(register,assert);
for(const [name,fn] of tasks) await execute(name,fn);
document.querySelector('#summary').textContent=`${passed} / ${total} 件成功${passed===total?'：すべてのテストが通りました。':'：失敗があります。'}`;
document.title=`${passed}/${total} 成功 | タングラム 幾何テスト`;
</script></html>
